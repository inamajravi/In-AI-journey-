<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Architect Tracker</title>
<style>
:root{--bg:#f7f6f3;--fg:#1c1b19;--card:#ffffff;--border:#e3e0d8;--accent:#7a5cff;--accent2:#1a936f;--muted:#6b6860;--locked:#c9c5b8;--code:#efede7;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15130f;--fg:#eeece6;--card:#1f1c17;--border:#332f27;--accent:#a58bff;--accent2:#4fd3a3;--muted:#a39d8e;--locked:#4a453b;--code:#2a261f;}}
:root[data-theme="dark"]{--bg:#15130f;--fg:#eeece6;--card:#1f1c17;--border:#332f27;--accent:#a58bff;--accent2:#4fd3a3;--muted:#a39d8e;--locked:#4a453b;--code:#2a261f;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.55;}
.wrap{max-width:680px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 18px max(60px,env(safe-area-inset-bottom));}
h1{font-size:1.35rem;margin:0 0 4px;}
h2{font-size:1rem;margin:22px 0 8px;color:var(--accent);text-transform:uppercase;letter-spacing:.03em;}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 18px;}
a{color:var(--accent);text-decoration:none;}
.crumbs{font-size:.82rem;color:var(--muted);margin-bottom:12px;}
.progress-outer{height:8px;border-radius:5px;background:var(--border);overflow:hidden;margin-bottom:20px;}
.progress-inner{height:100%;background:var(--accent);transition:width .3s;width:0;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;color:var(--fg);}
.card.locked{opacity:.55;}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:.82rem;font-weight:700;flex-shrink:0;}
.card.locked .badge{background:var(--locked);}
.card.done .badge{background:var(--accent2);}
.card .info{flex:1;}
.card .name{font-weight:600;font-size:.97rem;}
.card .pct{font-size:.8rem;color:var(--muted);}
.topicrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:10px;}
.topicrow input{width:18px;height:18px;flex-shrink:0;accent-color:var(--accent2);}
.topicrow a{flex:1;font-size:.95rem;font-weight:500;}
.topicrow.checked a{color:var(--muted);text-decoration:line-through;}
ul.pts{padding-left:18px;margin:6px 0;}
ul.pts li{margin:7px 0;font-size:.95rem;}
ol.chk{padding-left:20px;margin:6px 0;}
ol.chk li{margin:6px 0;font-size:.95rem;}
.box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.95rem;}
pre{background:var(--code);border:1px solid var(--border);border-radius:10px;padding:12px;overflow-x:auto;font-size:.8rem;line-height:1.45;}
.gate{margin-top:14px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb, var(--accent2) 12%, transparent);border:1px solid color-mix(in srgb, var(--accent2) 35%, transparent);font-size:.9rem;}
.gate b{color:var(--accent2);}
.donebar{margin-top:22px;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-weight:600;cursor:pointer;}
.donebar input{width:20px;height:20px;accent-color:var(--accent2);}
.lockmsg{padding:14px 0;font-size:.92rem;color:var(--muted);}
.nav{display:flex;justify-content:space-between;margin-top:24px;font-size:.9rem;flex-wrap:wrap;gap:10px;}
footer{color:var(--muted);font-size:.8rem;margin-top:24px;}
button.reset{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:.78rem;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
<h1>AI Application Architect — Tracker</h1>
<p class="sub">5 levels, 23 topic pages. A level unlocks once every topic in the one before it is ticked off. Progress saves in this browser.</p>
<div class="progress-outer"><div class="progress-inner" id="overallBar"></div></div>
<div id="levels"></div>
<footer><button class="reset" id="resetBtn">Reset all progress</button></footer>
<script>
const STORAGE_KEY = "ai-architect-tracker-v1";
const TASK_COUNTS = [4, 5, 6, 3, 5];
function freshChecks(){ return TASK_COUNTS.map(n => Array(n).fill(false)); }
function loadState(){
  let state = {};
  try{ const raw = localStorage.getItem(STORAGE_KEY); state = raw ? JSON.parse(raw) : {}; }catch(e){ state = {}; }
  if(!state.checks || state.checks.length !== TASK_COUNTS.length) state.checks = freshChecks();
  state.checks = state.checks.map((arr,i)=> Array.from({length:TASK_COUNTS[i]}, (_,j)=> !!(arr && arr[j])));
  return state;
}
function saveState(state){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){} }
function levelComplete(state,i){ return state.checks[i].length>0 && state.checks[i].every(Boolean); }
function levelUnlocked(state,i){ return i===0 || levelComplete(state,i-1); }
const LEVEL_META = [{"title": "Foundations: LLM Mechanics & API-Level Integration", "file": "level-1.html"}, {"title": "Applied Patterns: RAG, Agents, Orchestration", "file": "level-2.html"}, {"title": "Architecture: Production-Grade AI Systems", "file": "level-3.html"}, {"title": "Certification & Credibility Signal", "file": "level-4.html"}, {"title": "Lead-Level: Systems Thinking & Org Influence", "file": "level-5.html"}];

function render(){
  const state = loadState();
  const box = document.getElementById("levels"); box.innerHTML = "";
  let total=0, done=0;
  state.checks.forEach(a=>{ total+=a.length; done+=a.filter(Boolean).length; });
  document.getElementById("overallBar").style.width = total ? Math.round(done/total*100)+"%" : "0%";
  LEVEL_META.forEach((m,i)=>{
    const unlocked = levelUnlocked(state,i), complete = levelComplete(state,i);
    const d = state.checks[i].filter(Boolean).length, t = state.checks[i].length;
    const el = document.createElement(unlocked ? "a" : "div");
    if(unlocked) el.href = m.file;
    el.className = "card" + (unlocked?"":" locked") + (complete?" done":"");
    const badge = document.createElement("span"); badge.className="badge"; badge.textContent = i+1;
    const info = document.createElement("div"); info.className="info";
    const nm = document.createElement("div"); nm.className="name"; nm.textContent = m.title;
    const pc = document.createElement("div"); pc.className="pct";
    pc.textContent = unlocked ? d+"/"+t+" topics" : "Locked — finish Level "+i+" first";
    info.appendChild(nm); info.appendChild(pc);
    el.appendChild(badge); el.appendChild(info); box.appendChild(el);
  });
}
document.getElementById("resetBtn").addEventListener("click", ()=>{
  if(!confirm("Reset all progress?")) return;
  saveState({checks: freshChecks()}); render();
});
render();
</script>
</div>
</body>
</html>
